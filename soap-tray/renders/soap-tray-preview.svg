<text x="989" y="826" class="fine muted">17.4 mm assembled height, excluding soap</text>
<rect x="963" y="876" width="413" height="113" rx="18" fill="#dce8df"/>
<text x="989" y="907" font-size="15" font-weight="600">Designed to lift, drain, and rinse.</text>
<text x="989" y="934" class="fine muted">0.4 mm insert clearance per side.</text>
<text x="989" y="956" class="fine muted">5.8 mm soap clearance per side.</text>

<path d="M64 1012H1376" stroke="#cddbd4"/>
<text x="64" y="1045" class="fine muted">All dimensions in mm. Catch reservoir must be emptied periodically.</text>
