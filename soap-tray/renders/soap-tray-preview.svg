  <rect x="-52.8" y="-33.8" width="105.6" height="67.6" rx="4.8" fill="#cfe6d8"/>
  <g fill="#416e61">
    <use href="#slotPair" x="-44"/><use href="#slotPair" x="-36"/><use href="#slotPair" x="-28"/><use href="#slotPair" x="-20"/>
    <use href="#slotPair" x="-12"/><use href="#slotPair" x="-4"/><use href="#slotPair" x="4"/><use href="#slotPair" x="12"/>
    <use href="#slotPair" x="20"/><use href="#slotPair" x="28"/><use href="#slotPair" x="36"/><use href="#slotPair" x="44"/>
  </g>
  <g fill="#edf7eb" stroke="#b0d2bb" stroke-width=".3">
    <use href="#rib" x="-40"/><use href="#rib" x="-32"/><use href="#rib" x="-24"/><use href="#rib" x="-16"/><use href="#rib" x="-8"/>
    <use href="#rib" x="0"/><use href="#rib" x="8"/><use href="#rib" x="16"/><use href="#rib" x="24"/><use href="#rib" x="32"/><use href="#rib" x="40"/>
  </g>
</g>
<!-- Continuous rim shown as a filled ring above the deck plane. -->
<g transform="matrix(3 1.1 -3 1.1 451 551)">
  <path d="M-48-36.2H48Q55.2-36.2 55.2-29V29Q55.2 36.2 48 36.2H-48Q-55.2 36.2-55.2 29V-29Q-55.2-36.2-48-36.2Z M-48-33.8Q-52.8-33.8-52.8-29V29Q-52.8 33.8-48 33.8H48Q52.8 33.8 52.8 29V-29Q52.8-33.8 48-33.8Z" fill="#99c7ae" fill-rule="evenodd" stroke="#5c9279" stroke-width=".3"/>
</g>
<path class="leader" d="M705 572H772"/>
<circle cx="792" cy="572" r="18" fill="#214d42"/>
<text x="792" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="white" style="fill:white">01</text>
<text x="822" y="566" font-size="14" font-weight="600">FILTER</text>
<text x="822" y="587" class="fine muted">Lift to clean</text>

<!-- Water-catching base, rounded upper recess and lower reservoir. -->
<ellipse cx="451" cy="958" rx="238" ry="38" fill="#1b473e" opacity=".13" filter="url(#shadow)"/>
<g transform="matrix(3 1.1 -3 1.1 451 834.2)">
