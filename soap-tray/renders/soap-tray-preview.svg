</g>
<path d="M181 780L181 826.2L226 853L478 945.4L517 945.4L716 872L739 848V801.8L517 899.2H478Z" fill="url(#baseSide)"/>
<g transform="matrix(3 1.1 -3 1.1 451 788)">
  <rect x="-58" y="-39" width="116" height="78" rx="10" fill="#9fcbbc" stroke="#3d7e6c" stroke-width=".4"/>
  <rect x="-55.6" y="-36.6" width="111.2" height="73.2" rx="7.6" fill="#487f70"/>
  <g clip-path="url(#upperOpening)">
    <g transform="translate(6.818 6.818)">
      <rect x="-55.6" y="-36.6" width="111.2" height="73.2" rx="7.6" fill="#8bb9a6"/>
      <rect x="-52.8" y="-33.8" width="105.6" height="67.6" rx="4.8" fill="#487966"/>
      <g clip-path="url(#lowerOpening)">
        <rect x="-41.891" y="-22.891" width="105.6" height="67.6" rx="4.8" fill="#78a891"/>
        <path d="M-30 20Q-11 11 10 21T46 23M-23 26Q-6 20 8 27T34 30" fill="none" stroke="#afd8c5" stroke-width=".65" opacity=".65"/>
      </g>
    </g>
  </g>
  <!-- Conceptual indication of the two end finger recesses. -->
  <path d="M-58-9H-55.6V9H-58Z M55.6-9H58V9H55.6Z" fill="#437665"/>
</g>
<path class="leader" d="M727 826H772"/>
<circle cx="792" cy="826" r="18" fill="#214d42"/>
<text x="792" y="831" text-anchor="middle" font-size="13" font-weight="700" style="fill:white">02</text>
<text x="822" y="820" font-size="14" font-weight="600">BASE</text>
<text x="822" y="841" class="fine muted">Catches water</text>
<path class="leader" d="M178 849L153 875L448 983M154 869L153 875L160 875M442 977L448 983L442 983"/>
<text x="299" y="953" transform="rotate(20 299 953)" text-anchor="middle" class="fine">116 mm</text>
<path class="leader" d="M527 945L548 971L742 900M542 972L548 971L547 965M736 900L742 900L739 906"/>
<text x="652" y="949" transform="rotate(-20 652 949)" text-anchor="middle" class="fine">78 mm</text>

<!-- Specification column. -->
<rect x="963" y="177" width="413" height="192" rx="18" class="card"/>
<text x="989" y="209" class="eyebrow">01 / REMOVABLE FILTER</text>
<text x="989" y="248" class="dimension">110.4 × 72.4 mm</text>
<text x="989" y="278" class="body muted">3 mm deck · 4 mm retaining rim</text>
<text x="989" y="305" class="body muted">24 drainage slots · 11 raised ribs</text>
<text x="989" y="332" class="body muted">105.6 × 67.6 mm clear soap pocket</text>
<rect x="963" y="386" width="413" height="192" rx="18" class="card"/>
<text x="989" y="418" class="eyebrow">02 / DRAINAGE BASE</text>
<text x="989" y="457" class="dimension">116 × 78 × 15.4 mm</text>
<text x="989" y="487" class="body muted">2.4 mm floor and outer wall</text>
<text x="989" y="514" class="body muted">Continuous ledge supports the insert</text>
<text x="989" y="541" class="body muted">Finger recesses at both short ends</text>
<rect x="963" y="595" width="413" height="264" rx="18" class="card"/>
<text x="989" y="627" class="eyebrow">ASSEMBLED SECTION / SCHEMATIC</text>
<!-- Diagram is deliberately schematic, with exaggerated line thickness. -->
<path d="M1010 696V792H1327V696H1319V784H1018V696Z" fill="#5c9681"/>
<rect x="1018" y="752" width="10" height="32" fill="#5c9681"/>
<rect x="1309" y="752" width="10" height="32" fill="#5c9681"/>
