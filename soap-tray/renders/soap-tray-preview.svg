<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Soap Tray — two-piece design preview</title>
<desc id="desc">Exploded isometric concept illustration of a soap bar, removable slotted filter, and drainage base. All dimensions are in millimetres. Base dimensions are 116 by 78 by 15.4. The insert is 110.4 by 72.4 with twenty-four slots and eleven raised support ribs. Schematic of the original scripted model. Physical fit remains unverified.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8f5"/><stop offset="1" stop-color="#eaf0ed"/></linearGradient>
  <linearGradient id="baseSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#528c82"/><stop offset="1" stop-color="#2f645d"/></linearGradient>
  <linearGradient id="soapTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcfaf0" stop-opacity=".95"/><stop offset="1" stop-color="#dddcbf" stop-opacity=".72"/></linearGradient>
  <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="upperOpening"><rect x="-55.6" y="-36.6" width="111.2" height="73.2" rx="7.6"/></clipPath>
  <clipPath id="lowerOpening"><rect x="-52.8" y="-33.8" width="105.6" height="67.6" rx="4.8"/></clipPath>
  <g id="slotPair"><rect x="-2" y="-28" width="4" height="26" rx="2"/><rect x="-2" y="2" width="4" height="26" rx="2"/></g>
  <g id="rib"><rect x="-1" y="-26" width="2" height="52" rx=".8"/></g>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #183a34; }
    .muted { fill: #62756f; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .body { font-size: 16px; }
    .fine { font-size: 13px; }
    .dimension { font-size: 25px; font-weight: 600; letter-spacing: -.5px; }
    .leader { fill: none; stroke: #7c9690; stroke-width: 1.2; }
    .axis { fill: none; stroke: #72958b; stroke-width: 1.2; stroke-dasharray: 5 7; opacity: .6; }
    .card { fill: #ffffff; fill-opacity: .78; stroke: #d7e2dd; }
  </style>
</defs>
<rect width="1440" height="1080" fill="url(#background)"/>
<path d="M64 144H1376" stroke="#cddbd4"/>
<text x="64" y="51" class="eyebrow muted">SOAP TRAY / TWO-PIECE SYSTEM</text>
<text x="61" y="107" font-size="49" font-weight="600" letter-spacing="-2">A dry resting place.</text>
<rect x="1017" y="46" width="359" height="35" rx="17.5" fill="#d9e8df"/>
<text x="1196.5" y="68" text-anchor="middle" font-size="13" font-weight="600">DESIGNED FOR A 94 × 56 × 25 mm BAR</text>
<text x="1376" y="111" text-anchor="end" class="fine muted">Scripted geometry · physical fit unverified</text>

<!-- Exploded concept: vertical offsets intentionally exaggerated for clarity. -->
<text x="64" y="186" class="eyebrow muted">EXPLODED VIEW</text>
<text x="64" y="208" class="fine muted">Concept illustration · separation exaggerated</text>
<path class="axis" d="M308 421V792 M654 421V792"/>

<!-- Soap ghost, 94 × 56 × 25 mm. -->
<g transform="translate(451 265)">
  <path d="M-225-20.9L-225 54.1L57 157.5L225 95.9V20.9L57 82.5Z" fill="#d9d7b8" fill-opacity=".48" stroke="#b9bda6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M57 82.5V157.5" stroke="#b9bda6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g transform="matrix(3 1.1 -3 1.1 0 0)">
    <rect x="-47" y="-28" width="94" height="56" rx="1.1" fill="url(#soapTop)" stroke="#b8baa2" stroke-width=".45"/>
    <rect x="-35" y="-17" width="70" height="34" rx="8" fill="none" stroke="#c9ccb4" stroke-width=".45" opacity=".8"/>
    <text x="0" y="3" text-anchor="middle" font-size="8" font-weight="600" letter-spacing="1.8" fill="#9ca98d" opacity=".75">SOAP</text>
  </g>
</g>
<path class="leader" d="M676 354H746V323H803"/>
<text x="815" y="316" font-size="14" font-weight="600">SOAP BAR</text>
<text x="815" y="338" class="fine muted">94 × 56 × 25</text>

<!-- Removable insert: slightly separated rim, deck and underside portray thickness. -->
<ellipse cx="451" cy="665" rx="221" ry="39" fill="#345f54" opacity=".07" filter="url(#shadow)"/>
<g transform="matrix(3 1.1 -3 1.1 451 572)">
